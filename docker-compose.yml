version: "3"

services:
  rabbit-mq:
    image: rabbitmq:4.1.5-management-alpine
    container_name: rabbit-mq
    environment:
      - hostname=my-rabbit
      - RABBITMQ_DEFAULT_USER=
      - RABBITMQ_DEFAULT_PASS=
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbit-mq_data:/var/lib/rabbitmq

  go-service:
    container_name: go
    environment:
      - RABBITMQ_URL=amqp://:@rabbit-mq:5672/
    build:
      context: ./go/
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    depends_on:
      - rabbit-mq

volumes:
  rabbit-mq_data:
